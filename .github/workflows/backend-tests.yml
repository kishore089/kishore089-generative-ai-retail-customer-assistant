name: Backend reconstruction checks

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main, backend, "verify/**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Compile all backend Python files
        run: python -m compileall -q backend/lambdas backend/scripts backend/tests
      - name: Run backend unit tests
        run: python -m unittest discover -s backend/tests -p "test_*.py" -v
