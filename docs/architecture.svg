<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="810" viewBox="0 0 1400 810" role="img" aria-labelledby="title desc">
<title id="title">Retail AI Contact Center — AWS Architecture</title>
<desc id="desc">Retail customer assistant architecture showing web and voice clients, Connect and Lex, a Bedrock Agent Classic, Knowledge Base using S3 and S3 Vectors, backend Lambda functions, API Gateway, DynamoDB, and Amazon Cognito authentication in the web client.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#f2f5ff"/></linearGradient>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#4f46e5"/></marker>
<marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0f9488"/></marker>
<marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#f97316"/></marker>
<marker id="pink" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#db2777"/></marker>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#17213c}.title{font-size:30px;font-weight:750}.subtitle{font-size:14px;fill:#596780}.head{font-size:17px;font-weight:700}.label{font-size:13px;font-weight:650}.small{font-size:11.5px}.tiny{font-size:10px}.lane{stroke-width:1.5;rx:16}.box{fill:#fff;stroke-width:1.4;rx:9}.flow{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}</style>
</defs>
